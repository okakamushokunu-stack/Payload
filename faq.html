<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trustrida — Guide & FAQ</title>
<link rel="stylesheet" href="css/brand.css">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Page-specific styles — layer on top of brand.css / style.css.
     Uses the brand's own variables (--trust-green, --deep-navy, etc.) */
  header.faq-header {
    padding: 40px 0 24px;
  }
  .eyebrow {
    color: var(--trust-green);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
    font-family: var(--display-font);
  }
  header.faq-header h1 {
    font-size: 32px;
    margin: 0 0 12px;
  }
  header.faq-header h1 span { color: var(--trust-green); }
  .sub {
    color: var(--deep-navy);
    opacity: 0.75;
    font-size: 16px;
    margin: 0;
  }
  main.faq-main {
    padding-bottom: 60px;
  }
